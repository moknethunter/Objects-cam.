<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MokTrak</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#000; font-family:system-ui,sans-serif; }
  #wrap { position:relative; width:100vw; height:100vh; background:#000; overflow:hidden; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; z-index:1; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; }
  #hud { position:absolute; top:12px; right:12px; color:#00ff88; font:600 14px monospace;
    background:rgba(0,0,0,.7); padding:8px 14px; border-radius:20px; z-index:10; }
  #fps { position:absolute; top:12px; left:12px; color:#00ff88; font:600 12px monospace;
    background:rgba(0,0,0,.7); padding:6px 10px; border-radius:12px; z-index:10; }
  #hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#00ff88; font-size:16px; font-weight:700; background:rgba(0,0,0,.85);
    padding:16px 30px; border-radius:30px; z-index:6; display:none;
    border:2px solid #00ff88; text-align:center; }
  #panel { position:absolute; bottom:12px; left:12px; right:12px; color:#00ff88;
    font:500 14px ui-monospace,monospace; background:rgba(0,0,0,.9);
    padding:14px 18px; border-radius:14px; border:2px solid #00ff88;
    z-index:5; display:none; line-height:1.9; }
  #panel .title { color:#fff; font-weight:700; font-size:15px; margin-bottom:6px; }
  #panel .line { display:flex; justify-content:space-between; gap:10px; }
  #panel .label { color:rgba(0,255,136,.75); }
  #panel .value { color:#fff; font-weight:700; }
  #panel .value.right { color:#00e5ff; }
  #panel .value.left  { color:#ff9100; }
  #panel .value.up    { color:#ff5252; }
  #panel .value.down  { color:#b388ff; }
  #panel .value.zero  { color:#888; }
  #panel hr { border:0; border-top:1px solid rgba(0,255,136,.25); margin:6px 0; }
  #resetBtn { position:absolute; top:56px; right:12px; color:#000; background:#00ff88;
    border:none; padding:10px 18px; border-radius:22px; font:700 13px system-ui;
    z-index:7; display:none; cursor:pointer; box-shadow:0 4px 16px rgba(0,255,136,.6); }
  #startBtn { position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    padding:18px 50px; font-size:18px; font-weight:700; background:#00ff88; color:#000;
    border:none; border-radius:40px; z-index:10; box-shadow:0 8px 32px rgba(0,255,136,.5);
    cursor:pointer; }
  #startBtn:disabled { opacity:.6; }
  #err { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#ff5252; font-size:14px; background:rgba(0,0,0,.92); padding:20px;
    border-radius:12px; z-index:20; display:none; max-width:90%; text-align:center;
    border:2px solid #ff5252; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">MokTrak · جاهز</div>
  <div id="fps">-- fps</div>
  <div id="hint">المس الكائن الذي تريد قفله</div>
  <button id="resetBtn">✕ إلغاء القفل</button>
  <div id="panel"></div>
  <button id="startBtn">▶ تشغيل الكاميرا</button>
  <div id="err"></div>
</div>

<script>
window.addEventListener('error', function(ev) {
  var e = document.getElementById('err');
  if (e) { e.style.display = 'block'; e.textContent = 'خطأ: ' + (ev.message || 'غير معروف'); }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
(function(){
  'use strict';

  var SCORE_MIN = 0.35, SMOOTHING = 0.7, LOST_TIMEOUT = 1200;
  var LOCK_GRACE = 4000, IOU_MIN = 0.15;

  var video = document.getElementById('video');
  var canvas = document.getElementById('overlay');
  var ctx = canvas.getContext('2d');
  var hud = document.getElementById('hud');
  var fpsEl = document.getElementById('fps');
  var startBtn = document.getElementById('startBtn');
  var panelEl = document.getElementById('panel');
  var hintEl = document.getElementById('hint');
  var resetBtn = document.getElementById('resetBtn');
  var wrap = document.getElementById('wrap');
  var errEl = document.getElementById('err');

  var model = null;
  var running = false;
  var nextId = 1;
  var tracks = [];
  var lastFps = performance.now();
  var fpsCount = 0;

  var lockedId = null;
  var lockedLastBox = null;
  var lockedLastSeen = 0;
  var lockData = null;

  function resize() {
    var r = wrap.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      canvas.width = Math.round(r.width);
      canvas.height = Math.round(r.height);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });
  resize();

  function iou(a, b) {
    var x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
    var x2 = Math.min(a[0]+a[2], b[0]+b[2]);
    var y2 = Math.min(a[1]+a[3], b[1]+b[3]);
    var i = Math.max(0, x2-x1) * Math.max(0, y2-y1);
    var u = a[2]*a[3] + b[2]*b[3] - i;
    return u > 0 ? i/u : 0;
  }
  function smooth(p, n) {
    var a = SMOOTHING, b = 1 - SMOOTHING;
    return [p[0]*a+n[0]*b, p[1]*a+n[1]*b, p[2]*a+n[2]*b, p[3]*a+n[3]*b];
  }
  function fmt(n) { return (n >= 0 ? '+' : '') + n.toFixed(0); }
  function absFmt(n) { return Math.abs(n).toFixed(0); }

  function dirClass(v) {
    if (Math.abs(v) < 2) return 'zero';
    return v > 0 ? 'right' : 'left';
  }
  function dirClassY(v) {
    if (Math.abs(v) < 2) return 'zero';
    return v > 0 ? 'down' : 'up';
  }
  function dirTextX(v) {
    if (Math.abs(v) < 2) return '●';
    return v > 0 ? '→ يمين' : '← يسار';
  }
  function dirTextY(v) {
    if (Math.abs(v) < 2) return '●';
    return v > 0 ? '↓ أسفل' : '↑ أعلى';
  }

  function getFit() {
    var wrapW = canvas.width, wrapH = canvas.height;
    var vw = video.videoWidth || 640, vh = video.videoHeight || 480;
    var scale = Math.max(wrapW/vw, wrapH/vh);
    return {
      scale: scale,
      ox: (wrapW - vw*scale) / 2,
      oy: (wrapH - vh*scale) / 2,
      vw: vw, vh: vh,
      cx: wrapW/2, cy: wrapH/2
    };
  }

  function v2c(px, py, fit) {
    return [fit.ox + px*fit.scale, fit.oy + py*fit.scale];
  }

  function touchToVideo(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var sx = (clientX - r.left) * (canvas.width / r.width);
    var sy = (clientY - r.top) * (canvas.height / r.height);
    var fit = getFit();
    return [(sx - fit.ox) / fit.scale, (sy - fit.oy) / fit.scale];
  }

  async function start() {
    startBtn.disabled = true;
    startBtn.textContent = '… تحميل';
    hud.textContent = 'تحميل الموديل…';
    errEl.style.display = 'none';

    try {
      if (typeof cocoSsd === 'undefined') {
        throw new Error('فشل تحميل الموديل - تحقق من الإنترنت');
      }
      model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });

      hud.textContent = 'تشغيل الكاميرا…';
      var stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' },
                 width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });

      video.srcObject = stream;
      await new Promise(function(r){ video.onloadedmetadata = r; });
      await video.play();

      startBtn.style.display = 'none';
      hud.textContent = 'MokTrak · جاهز';
      running = true;
      resize();

      setTimeout(function(){
        if (!lockedId) {
          hintEl.style.display = 'block';
          setTimeout(function(){ hintEl.style.display = 'none'; }, 4500);
        }
      }, 1200);

      loop();
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = 'خطأ: ' + e.message;
      hud.textContent = 'فشل التشغيل';
      startBtn.disabled = false;
      startBtn.textContent = '↻ إعادة المحاولة';
    }
  }

  function lockOn(t) {
    var x = t.box[0], y = t.box[1], w = t.box[2], h = t.box[3];
    lockedId = t.id;
    lockedLastBox = [x, y, w, h];
    lockedLastSeen = performance.now();

    // احسب الإحداثيات الأولية بالنسبة لمركز الإطار (بكسل الفيديو)
    var fit = getFit();
    var vcx = fit.vw / 2, vcy = fit.vh / 2;
    var objCx = x + w/2, objCy = y + h/2;
    var relX0 = objCx - vcx;
    var relY0 = objCy - vcy;

    lockData = {
      startRelX: relX0,
      startRelY: relY0,
      prevRelX: relX0,
      prevRelY: relY0,
      prevT: 0,
      label: t.label,
      score: t.score,
      box0: [x, y, w, h]
    };

    hud.textContent = '🎯 مقفل: ' + t.label;
    resetBtn.style.display = 'block';
    panelEl.style.display = 'block';
    hintEl.style.display = 'none';
  }

  function unlock() {
    lockedId = null; lockedLastBox = null; lockData = null;
    resetBtn.style.display = 'none';
    panelEl.style.display = 'none';
    hud.textContent = 'MokTrak · جاهز';
  }

  wrap.addEventListener('click', function(e){
    if (!running) return;
    if (e.target === startBtn || e.target === resetBtn) return;
    if (e.target === errEl) return;

    var p = touchToVideo(e.clientX, e.clientY);
    var px = p[0], py = p[1];

    var best = null, bestScore = Infinity;
    for (var i = 0; i < tracks.length; i++) {
      var t = tracks[i];
      var x = t.box[0], y = t.box[1], w = t.box[2], h = t.box[3];
      var cx = x + w/2, cy = y + h/2;
      var d = Math.sqrt((cx-px)*(cx-px) + (cy-py)*(cy-py));
      var inside = px >= x && px <= x+w && py >= y && py <= y+h;
      var score = inside ? d - 1000 : d;
      if (score < bestScore) { bestScore = score; best = t; }
    }
    if (best && bestScore < 350) lockOn(best);
    else unlock();
  });
  resetBtn.addEventListener('click', function(e){ e.stopPropagation(); unlock(); });

  // ─── صليب الهدف (على الكائن) ───
  function drawTargetCrosshair(cx, cy, size, live) {
    ctx.save();
    ctx.strokeStyle = live ? '#00ff88' : 'rgba(0,255,136,.55)';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = live ? 10 : 4;

    var gap = size*0.25, arm = size;

    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx-arm, cy); ctx.lineTo(cx-gap, cy);
    ctx.moveTo(cx+gap, cy); ctx.lineTo(cx+arm, cy);
    ctx.moveTo(cx, cy-arm); ctx.lineTo(cx, cy-gap);
    ctx.moveTo(cx, cy+gap); ctx.lineTo(cx, cy+arm);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, gap*0.85, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = live ? '#00ff88' : 'rgba(0,255,136,.55)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2.5, 0, Math.PI*2);
    ctx.fill();

    ctx.lineWidth = 3;
    var r2 = arm + 6, arcLen = Math.PI/4;
    for (var k = 0; k < 4; k++) {
      var base = k*Math.PI/2 + Math.PI/4 - arcLen/2;
      ctx.beginPath();
      ctx.arc(cx, cy, r2, base, base+arcLen);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ─── علامة مركز الشاشة (المصدر) ───
  function drawScreenCenter(cx, cy) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,59,.9)';
    ctx.fillStyle = 'rgba(255,235,59,.9)';
    ctx.shadowColor = '#ffeb3b';
    ctx.shadowBlur = 8;
    ctx.lineWidth = 2;

    var s = 14, gap = 4;
    ctx.beginPath();
    ctx.moveTo(cx-s, cy); ctx.lineTo(cx-gap, cy);
    ctx.moveTo(cx+gap, cy); ctx.lineTo(cx+s, cy);
    ctx.moveTo(cx, cy-s); ctx.lineTo(cx, cy-gap);
    ctx.moveTo(cx, cy+gap); ctx.lineTo(cx, cy+s);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  async function loop() {
    if (!running) return;

    var now = performance.now();
    fpsCount++;
    if (now - lastFps >= 1000) {
      fpsEl.textContent = fpsCount + ' fps';
      fpsCount = 0; lastFps = now;
    }

    var preds = [];
    try { preds = await model.detect(video, 8, SCORE_MIN); } catch(e){}

    var dets = [];
    for (var i = 0; i < preds.length; i++) {
      var p = preds[i];
      dets.push({ label: p.class, score: p.score, box: p.bbox,
                  area: p.bbox[2]*p.bbox[3] });
    }
    dets.sort(function(a,b){ return b.area - a.area; });
    dets = dets.slice(0, 5);

    var used = [];
    for (var i = 0; i < tracks.length; i++) used.push(false);
    var fresh = [];

    for (var i = 0; i < dets.length; i++) {
      var d = dets[i];
      var bi = -1, biou = IOU_MIN;
      for (var j = 0; j < tracks.length; j++) {
        if (used[j]) continue;
        var v = iou(tracks[j].box, d.box);
        if (v > biou) { biou = v; bi = j; }
      }
      if (bi >= 0) {
        used[bi] = true;
        var t = tracks[bi];
        fresh.push({ id: t.id, box: smooth(t.box, d.box),
                     label: d.label, score: d.score, lastSeen: now });
      } else {
        fresh.push({ id: nextId++, box: d.box.slice(),
                     label: d.label, score: d.score, lastSeen: now });
      }
    }
    for (var i = 0; i < tracks.length; i++) {
      if (!used[i] && now - tracks[i].lastSeen < LOST_TIMEOUT) fresh.push(tracks[i]);
    }
    tracks = fresh;

    var lockedTrack = null;
    if (lockedId !== null) {
      for (var i = 0; i < tracks.length; i++) {
        if (tracks[i].id === lockedId) { lockedTrack = tracks[i]; break; }
      }
      if (lockedTrack) {
        lockedLastSeen = now;
        lockedLastBox = lockedTrack.box.slice();
      } else if (now - lockedLastSeen > LOCK_GRACE) {
        unlock();
      }
    }

    if (canvas.width !== Math.round(wrap.getBoundingClientRect().width)) resize();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var fit = getFit();

    // ═══ قبل القفل: مربعات متقطعة لأكبر كائنين ═══
    if (lockedId === null) {
      var top = tracks.slice(0, 2);
      for (var i = 0; i < top.length; i++) {
        var t = top[i];
        var x = t.box[0], y = t.box[1], w = t.box[2], h = t.box[3];
        var tl = v2c(x, y, fit);
        var br = v2c(x+w, y+h, fit);
        var dw = br[0]-tl[0], dh = br[1]-tl[1];

        ctx.strokeStyle = 'rgba(0,255,136,.7)';
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(tl[0], tl[1], dw, dh);
        ctx.setLineDash([]);

        var text = '#' + t.id + ' ' + t.label + ' ' + (t.score*100).toFixed(0) + '%';
        ctx.font = 'bold 14px monospace';
        var tw = ctx.measureText(text).width;
        ctx.fillStyle = 'rgba(0,255,136,.85)';
        ctx.fillRect(tl[0], tl[1]-24, tw+12, 24);
        ctx.fillStyle = '#000';
        ctx.fillText(text, tl[0]+6, tl[1]-7);
      }
    }
    // ═══ بعد القفل ═══
    else {
      var drawBox = lockedTrack ? lockedTrack.box : lockedLastBox;
      var isLive = !!lockedTrack;

      if (drawBox) {
        var x = drawBox[0], y = drawBox[1], w = drawBox[2], h = drawBox[3];
        var tl = v2c(x, y, fit);
        var br = v2c(x+w, y+h, fit);
        var dw = br[0]-tl[0], dh = br[1]-tl[1];
        var objCx = tl[0] + dw/2;
        var objCy = tl[1] + dh/2;

        var scx = fit.cx, scy = fit.cy;

        // 1) خط من مركز الشاشة إلى الكائن
        ctx.save();
        ctx.strokeStyle = 'rgba(255,235,59,.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(scx, scy);
        ctx.lineTo(objCx, objCy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 2) إطار الكائن
        ctx.strokeStyle = isLive ? '#00ff88' : 'rgba(0,255,136,.5)';
        ctx.lineWidth = 4;
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = isLive ? 15 : 4;
        ctx.strokeRect(tl[0], tl[1], dw, dh);
        ctx.shadowBlur = 0;

        // 3) صليب على الكائن
        var crossSize = Math.max(26, Math.min(dw, dh) * 0.28);
        drawTargetCrosshair(objCx, objCy, crossSize, isLive);

        // 4) علامة مركز الشاشة
        drawScreenCenter(scx, scy);

        // 5) لافتة
        var text = '🎯 ' + (lockedTrack ? lockedTrack.label : lockData.label) +
                   ' ' + ((lockedTrack ? lockedTrack.score : lockData.score)*100).toFixed(0) + '%';
        ctx.font = 'bold 16px monospace';
        var tw = ctx.measureText(text).width;
        ctx.fillStyle = isLive ? '#00ff88' : 'rgba(0,255,136,.65)';
        ctx.fillRect(tl[0], tl[1]-30, tw+16, 30);
        ctx.fillStyle = '#000';
        ctx.fillText(text, tl[0]+8, tl[1]-10);

        // ═══ الحسابات بالنسبة لمركز الشاشة ═══
        // إحداثيات الكائن بالنسبة لمركز الإطار (بكسل الفيديو)
        var vcx = fit.vw / 2;
        var vcy = fit.vh / 2;
        var objVideoCx = x + w/2;
        var objVideoCy = y + h/2;

        // الإزاحة عن المركز بوحدات بكسل الفيديو (أدق مقياس)
        var relX = objVideoCx - vcx;   // + = يمين المركز
        var relY = objVideoCy - vcy;   // + = أسفل المركز

        // التغير اللحظي (بين إطار وآخر) بالنسبة لمركز الشاشة
        var deltaX = 0, deltaY = 0, dt = 0;
        if (isLive) {
          if (lockData.prevT > 0) {
            dt = Math.max(1, now - lockData.prevT);
            deltaX = relX - lockData.prevRelX;
            deltaY = relY - lockData.prevRelY;
          }
          lockData.prevRelX = relX;
          lockData.prevRelY = relY;
          lockData.prevT = now;
        }

        // التغير الكلي منذ لحظة القفل
        var totalX = relX - lockData.startRelX;
        var totalY = relY - lockData.startRelY;

        // مسافة الكائن عن المركز الآن
        var distNow = Math.sqrt(relX*relX + relY*relY);

        // سرعة التغير
        var speedX = dt > 0 ? deltaX / dt * 1000 : 0;
        var speedY = dt > 0 ? deltaY / dt * 1000 : 0;

        // ═══ لوحة المعلومات ═══
        panelEl.innerHTML =
          '<div class="title">🎯 ' + (lockedTrack ? lockedTrack.label : lockData.label) +
            ' · ثقة ' + ((lockedTrack ? lockedTrack.score : lockData.score)*100).toFixed(0) + '%' +
            (isLive ? '' : ' · ⏸ فقدان مؤقت') + '</div>' +

          '<hr>' +

          '<div class="line">' +
            '<span class="label">📍 الموضع عن المركز — أفقي (X):</span>' +
            '<span class="value ' + dirClass(relX) + '">' + fmt(relX) + ' · ' + dirTextX(relX) + '</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">📍 الموضع عن المركز — عمودي (Y):</span>' +
            '<span class="value ' + dirClassY(relY) + '">' + fmt(relY) + ' · ' + dirTextY(relY) + '</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">📏 المسافة عن المركز:</span>' +
            '<span class="value">' + absFmt(distNow) + ' px</span>' +
          '</div>' +

          '<hr>' +

          '<div class="line">' +
            '<span class="label">⚡ التغير اللحظي — أفقي (ΔX):</span>' +
            '<span class="value ' + dirClass(deltaX) + '">' + fmt(deltaX) + ' px</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">⚡ التغير اللحظي — عمودي (ΔY):</span>' +
            '<span class="value ' + dirClassY(deltaY) + '">' + fmt(deltaY) + ' px</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">💨 سرعة التغير — أفقي:</span>' +
            '<span class="value ' + dirClass(speedX) + '">' + fmt(speedX) + ' px/s</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">💨 سرعة التغير — عمودي:</span>' +
            '<span class="value ' + dirClassY(speedY) + '">' + fmt(speedY) + ' px/s</span>' +
          '</div>' +

          '<hr>' +

          '<div class="line">' +
            '<span class="label">📈 التغير الكلي — أفقي (ΣΔX):</span>' +
            '<span class="value ' + dirClass(totalX) + '">' + fmt(totalX) + ' px</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">📈 التغير الكلي — عمودي (ΣΔY):</span>' +
            '<span class="value ' + dirClassY(totalY) + '">' + fmt(totalY) + ' px</span>' +
          '</div>' +
          '<div class="line">' +
            '<span class="label">📐 حجم الكائن:</span>' +
            '<span class="value">' + w.toFixed(0) + ' × ' + h.toFixed(0) + ' px</span>' +
          '</div>';
      }
    }

    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
